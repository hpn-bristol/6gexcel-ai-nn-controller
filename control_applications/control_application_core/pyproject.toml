[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-application-core"
version = "0.1.0"
description = "Minimal core control application for ai_nn_controller"
requires-python = ">=3.9"
dependencies = ["ai_nn_controller>=1.0.0"]

[project.entry-points."ai_nn_controller.app_init"]
"control_application_core:aic_app" = "ai_nn_controller.plugins.entrypoints:bootstrap_application_bundle"

[tool.setuptools]
py-modules = ["aic_app"]
